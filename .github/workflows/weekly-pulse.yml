name: Weekly Review Pulse

on:
  schedule:
    # Every Monday at 03:30 UTC (09:00 IST)
    - cron: '30 3 * * 1'
  workflow_dispatch:
    inputs:
      week:
        description: 'ISO Week to process (e.g. 2026-W14). Defaults to current week.'
        required: false
        type: string
      force:
        description: 'Force re-run even if already completed'
        required: false
        type: boolean
        default: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache Hugging Face Transformers models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-hf-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      # - name: Run Review Pulse Pipeline
      #   env:
      #     GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
