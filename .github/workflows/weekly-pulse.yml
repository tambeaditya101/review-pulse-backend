      #       ARGS="$ARGS --week ${{ github.event.inputs.week }}"
      #     fi
      #     if [ "${{ github.event.inputs.force }}" = "true" ]; then
      #       ARGS="$ARGS --force"
      #     fi
          
      #     # Initialize database
      #     python -m review_pulse init-db
          
      #     # Execute run
